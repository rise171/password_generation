version: '3.8'

services:
  nginx:
    image: nginx-proxy:latest 
    ports:
      - "80:80"
    networks:
      - microservices-net
    deploy:
      replicas: 1

  password-checker:
    image: password-checker:latest 
    networks:
      - microservices-net
    deploy:
      replicas: 2

  password-logger:
    image: password-logger:latest
    networks:
      - microservices-net
    volumes:
      - log_data:/app/logs
    deploy:
      replicas: 2

volumes:
  log_data:

networks:
  microservices-net:
    driver: overlay